# ros2_control controllers for the hexapod (18 position-controlled joints)
# Only ONE of leg_position_controller / leg_trajectory_controller may be active at a time
# (both claim the same position command interfaces).
# Used by this package's launch/gazebo.launch.py. The full stack (hexapod_bringup/sim.launch.py)
# loads hexapod_bringup/config/controllers.yaml instead (hexapod_controller, used by locomotion_node).
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz. Real-time note: keep >= 2x the gait-planner rate; hobby servos accept 50-333 Hz PWM

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Low-latency streaming interface for the gait generator (std_msgs/Float64MultiArray, 18 values,
    # order = 'joints' below). Recommended for the adaptive gait controller.
    leg_position_controller:
      type: position_controllers/JointGroupPositionController

    # Alternative: interpolated trajectories (e.g. stand-up / sit-down motions, MoveIt tests)
    leg_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

leg_position_controller:
  ros__parameters:
    joints:
      - front_left_coxa_joint
      - front_left_femur_joint
      - front_left_tibia_joint
      - middle_left_coxa_joint
      - middle_left_femur_joint
      - middle_left_tibia_joint
      - rear_left_coxa_joint
      - rear_left_femur_joint
      - rear_left_tibia_joint
      - front_right_coxa_joint
      - front_right_femur_joint
      - front_right_tibia_joint
      - middle_right_coxa_joint
      - middle_right_femur_joint
      - middle_right_tibia_joint
      - rear_right_coxa_joint
      - rear_right_femur_joint
      - rear_right_tibia_joint

leg_trajectory_controller:
  ros__parameters:
    joints:
      - front_left_coxa_joint
      - front_left_femur_joint
      - front_left_tibia_joint
      - middle_left_coxa_joint
      - middle_left_femur_joint
      - middle_left_tibia_joint
      - rear_left_coxa_joint
      - rear_left_femur_joint
      - rear_left_tibia_joint
      - front_right_coxa_joint
      - front_right_femur_joint
      - front_right_tibia_joint
      - middle_right_coxa_joint
      - middle_right_femur_joint
      - middle_right_tibia_joint
      - rear_right_coxa_joint
      - rear_right_femur_joint
      - rear_right_tibia_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true
    state_publish_rate: 50.0
